name: Update NexPress

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published NexPress version (for example 0.4.4)
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-nexpress
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://nexpress:nexpress@localhost:5433/nexpress_hosted_demo_ci
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NP_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NP_UPDATE_VERSION: ${{ inputs.version }}
      SITE_URL: http://localhost:3000

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Update packages and generate migrations
        run: pnpm run update:nexpress -- "$NP_UPDATE_VERSION"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Detect update
        id: changes
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NexPress $NP_UPDATE_VERSION is already synchronized." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish automation branch and draft PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/nexpress-v$NP_UPDATE_VERSION"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json pnpm-lock.yaml drizzle
          git commit -m "chore: update NexPress to $NP_UPDATE_VERSION"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          body_file=$(mktemp)
          migrations=$(git diff --name-only origin/main...HEAD -- 'drizzle/*.sql')
          if [ -z "$migrations" ]; then
            migrations="None"
          fi
          {
            echo "## What changed"
            echo
            echo "- synchronized every installed \`@nexpress/*\` package to \`$NP_UPDATE_VERSION\`"
            echo "- refreshed the exact pnpm lockfile"
            echo "- generated schema migrations before validation"
            echo
            echo "## Migration review"
            echo
            echo '```text'
            echo "$migrations"
            echo '```'
            echo
            echo "This PR stays draft until the generated migration and Vercel preview are reviewed."
            echo
            echo "## Validation"
            echo
            echo "- \`pnpm run typecheck\`"
            echo "- \`pnpm test\`"
            echo "- \`pnpm run build\`"
          } > "$body_file"

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --title "chore: update NexPress to $NP_UPDATE_VERSION" \
              --body-file "$body_file"
            pr_url=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          else
            pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --draft \
              --title "chore: update NexPress to $NP_UPDATE_VERSION" \
              --body-file "$body_file")
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          echo "Draft update PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
